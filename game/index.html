<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Palmera Bay — an original open-world crime game: steal cars, outrun the Palmera Bay PD at up to five wanted stars, run ten story jobs, race the Neon Grand Prix, and take the Vault.">
<title>Palmera Bay — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101820; }
  #game { position: fixed; display: block; touch-action: none; background: #101820; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Palmera Bay: an open-world crime game. Steal cars, take jobs at Moreno Motors, lose the cops — a police helicopter circles at five wanted stars."></canvas>
<noscript><p style="color:#eef1f5;font-family:sans-serif;padding:2em">Palmera Bay needs JavaScript to run — it is a browser game with no network requests.</p></noscript>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
